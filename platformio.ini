; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Atomic ESP32 LED module firmware (V0)

[platformio]
description = Atomic ESP32 LED module firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ArduinoJson 6 parses serial and MQTT commands off the heap.
; PubSubClient is the MQTT client. The packet size fits one max sequence.
; Wi-Fi and the broker host are constants in src/net, not in this file.
build_flags =
    -D MQTT_MAX_PACKET_SIZE=4268
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    knolleary/PubSubClient@2.8.0